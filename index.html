<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4R Gastronómico - Orden Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap');
        * { transition: background-color 0.3s ease, color 0.3s ease; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b111e; 
            color: #f1f5f9;
        }
        body.light-mode {
            background-color: #fafafa;
            color: #1e293b;
        }
        .animated-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -2; 
            background: linear-gradient(135deg, #0b111e 0%, #1a2332 50%, #0f1624 100%);
        }
        body.light-mode .animated-bg {
            background: linear-gradient(135deg, #fff8f0 0%, #fef3e2 50%, #fafaf0 100%);
        }
        .glass-card { 
            background: rgba(22, 31, 49, 0.8); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(218, 165, 32, 0.15); 
        }
        body.light-mode .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(218, 165, 32, 0.2);
        }
        .accent-gradient { 
            background: linear-gradient(135deg, #d4801e 0%, #f4a225 100%); 
        }
        .product-card {
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(218, 165, 32, 0.5);
        }
        .toast {
            position: fixed;
            bottom: 110px;
            right: 20px;
            z-index: 100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .category-pill {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(218, 165, 32, 0.3);
            background: transparent;
            color: #f1f5f9;
        }
        body.light-mode .category-pill {
            color: #1e293b;
        }
        .category-pill.active {
            background: linear-gradient(135deg, #d4801e 0%, #f4a225 100%);
            border-color: #d4801e;
            color: #0b111e !important;
        }
        .stock-badge {
            position: absolute;
            bottom: 3px;
            right: 3px;
            z-index: 20;
        }
        .stock-badge span {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
        }
        .stock-in span { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
        .stock-low span { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        .stock-out span { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; }
        .qty-selector {
            background: rgba(22, 31, 49, 0.8);
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 12px;
            padding: 6px 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        body.light-mode .qty-selector {
            background: rgba(255, 255, 255, 0.9);
        }
        .qty-selector button {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-48 min-h-screen relative">
    <div class="animated-bg"></div>

    <!-- HEADER -->
    <div class="fixed top-0 left-0 right-0 z-40 bg-gradient-to-b from-black/80 to-black/0 backdrop-blur-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <button type="button" onclick="toggleTheme()" class="w-10 h-10 rounded-lg glass-card flex items-center justify-center text-amber-500">
                <i id="theme-icon" class="ph ph-moon-stars text-lg"></i>
            </button>
            
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-500 to-amber-700 rounded-lg flex items-center justify-center text-white font-bold">🍗</div>
                <div class="text-center">
                    <p class="text-xs font-black text-amber-500">4R Gastronómico</p>
                    <p class="text-[9px] text-amber-600">Premium Food</p>
                </div>
            </div>
            
            <button type="button" onclick="openAdmin()" class="w-10 h-10 glass-card rounded-lg flex items-center justify-center text-amber-500">
                <i class="ph ph-gear-six text-lg"></i>
            </button>
        </div>
    </div>

    <!-- HERO -->
    <header class="pt-24 pb-6 text-center relative z-10">
        <h1 class="text-3xl font-black uppercase text-amber-500 px-4 tracking-tight">4R Premium</h1>
        <p class="text-xs uppercase font-bold tracking-widest text-gray-400 mt-1">Delicias Gastronómicas</p>
    </header>

    <!-- FILTROS -->
    <div class="max-w-md mx-auto px-4 mb-5 space-y-3">
        <div class="glass-card rounded-xl p-3 flex items-center gap-2">
            <i class="ph ph-magnifying-glass text-amber-500 text-lg"></i>
            <input type="text" id="search-input" placeholder="Buscar especialidades..." class="flex-1 bg-transparent outline-none placeholder-gray-500 text-sm text-white" oninput="syncPlatform()">
        </div>
        
        <div class="flex gap-2 overflow-x-auto pb-2">
            <button type="button" onclick="filterCategory('todos')" class="category-pill active whitespace-nowrap" id="cat-todos">Todos</button>
            <button type="button" onclick="filterCategory('tequeños')" class="category-pill whitespace-nowrap" id="cat-tequeños">Tequeños</button>
            <button type="button" onclick="filterCategory('empanadas')" class="category-pill whitespace-nowrap" id="cat-empanadas">Empanadas</button>
            <button type="button" onclick="filterCategory('bebidas')" class="category-pill whitespace-nowrap" id="cat-bebidas">Bebidas</button>
            <button type="button" onclick="filterCategory('combos')" class="category-pill whitespace-nowrap" id="cat-combos">Combos</button>
        </div>
    </div>

    <!-- FORMULARIO TRANSACCIONAL -->
    <main class="max-w-md mx-auto px-4 space-y-6">
        <form id="orderForm" action="https://formspree.io/f/xyzqwvjk" method="POST" enctype="multipart/form-data" class="space-y-6">
            
            <!-- CONTENEDOR DE CATÁLOGO -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-bowl-food text-base"></i> Nuestro Menú</h2>
                <div id="products-container" class="grid grid-cols-1 gap-3"></div>
                <div id="no-results" class="hidden text-center py-12 text-gray-400">
                    <p class="text-sm font-bold">No se encontraron productos</p>
                </div>
            </div>

            <!-- DESPACHO -->
            <div class="space-y-3">
                <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-map-pin text-base"></i> Datos de Entrega</h2>
                <div class="glass-card rounded-2xl p-4 space-y-3">
                    <input type="text" name="Nombre" placeholder="¿Quién recibe el pedido?" required class="w-full bg-black/20 border border-gray-700/50 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-white">
                    <input type="tel" name="Telefono" placeholder="Teléfono de contacto" required class="w-full bg-black/20 border border-gray-700/50 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-white">
                    
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 font-bold">📍 Coordenadas de Envío</label>
                        <button type="button" onclick="getGPSLocation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-all active:scale-95">
                            <i class="ph ph-compass text-lg"></i>
                            <span id="gps-btn-text">Vincular Ubicación GPS Actual</span>
                        </button>
                        <input type="hidden" name="Latitud" id="input-lat">
                        <input type="hidden" name="Longitud" id="input-lng">
                        <div id="gps-info" class="text-xs text-blue-400 font-medium hidden text-center bg-blue-500/10 py-2 rounded-lg border border-blue-500/20">
                            📍 Ubicación guardada: <span id="gps-coords"></span>
                        </div>
                    </div>
                    
                    <textarea name="Direccion" placeholder="Dirección exacta de despacho" required rows="2" class="w-full bg-black/20 border border-gray-700/50 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 resize-none text-white"></textarea>
                </div>
            </div>

            <!-- RECAUDACIÓN PAGO MÓVIL -->
            <div class="space-y-3">
                <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-credit-card text-base"></i> Información de Pago Móvil</h2>
                <div class="glass-card rounded-2xl p-4 border-l-4 border-amber-500 space-y-3">
                    <div class="flex justify-between items-center cursor-pointer hover:bg-black/10 p-2 rounded-lg transition-colors" onclick="copyToClipboard(document.getElementById('lbl-banco').textContent)">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Banco</p>
                            <p id="lbl-banco" class="font-bold text-sm text-white">Bancamiga (0172)</p>
                        </div>
                        <i class="ph ph-copy text-amber-500 text-lg"></i>
                    </div>
                    <div class="h-px bg-gray-700/30"></div>
                    <div class="flex justify-between items-center cursor-pointer hover:bg-black/10 p-2 rounded-lg transition-colors" onclick="copyToClipboard(document.getElementById('lbl-rif').textContent)">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">RIF / Cédula</p>
                            <p id="lbl-rif" class="font-bold text-sm text-white">V-23486156</p>
                        </div>
                        <i class="ph ph-copy text-amber-500 text-lg"></i>
                    </div>
                    <div class="h-px bg-gray-700/30"></div>
                    <div class="flex justify-between items-center cursor-pointer hover:bg-black/10 p-2 rounded-lg transition-colors" onclick="copyToClipboard(document.getElementById('lbl-tel').textContent)">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Teléfono</p>
                            <p id="lbl-tel" class="font-bold text-sm text-white">0424571136</p>
                        </div>
                        <i class="ph ph-copy text-amber-500 text-lg"></i>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <div class="relative">
                        <input type="file" name="Comprobante" id="file-input" required accept="image/*" class="hidden">
                        <label for="file-input" class="flex items-center justify-center gap-3 w-full border-2 border-dashed border-gray-700/50 rounded-xl p-5 cursor-pointer bg-white/5 hover:bg-white/10 transition-colors">
                            <i class="ph ph-upload-simple text-2xl text-amber-500"></i>
                            <div id="file-name" class="text-xs text-gray-400 text-center">
                                <p class="font-bold">Adjuntar captura del pago</p>
                                <p class="text-[10px] mt-0.5">JPG, PNG • Máx 5MB</p>
                            </div>
                        </label>
                    </div>
                    <input type="text" name="Referencia" placeholder="Últimos 6 números de referencia" maxlength="6" required class="w-full bg-black/20 border border-gray-700/50 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-white">
                </div>
            </div>

            <!-- INPUTS CONTROLADOS DE PASARELA -->
            <input type="hidden" name="Monto_Total" id="hidden-total" value="$0.00">
            <input type="hidden" name="Detalle_Pedido" id="hidden-summary" value="">
        </form>
    </main>

    <!-- FOOTER: CHECKOUT COMPONENT -->
    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black/95 to-transparent translate-y-full transition-transform duration-300 z-30">
        <div class="max-w-md mx-auto glass-card rounded-2xl p-4 border border-amber-500/30 space-y-3 shadow-2xl">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Total Neto</p>
                    <p class="text-2xl font-black text-emerald-400" id="total-display">$0.00</p>
                </div>
                <button type="button" onclick="submitOrder()" class="accent-gradient px-6 py-3 rounded-xl text-white font-bold text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-transform flex items-center gap-2">
                    <i class="ph ph-paper-plane-right text-base"></i> Enviar Pedido
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md p-6 flex items-center justify-center">
        <div class="max-w-md w-full glass-card p-6 rounded-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2"><i class="ph ph-sliders text-amber-500"></i> Consola Remota</h2>
                <button type="button" onclick="closeAdmin()" class="w-8 h-8 rounded-lg bg-gray-800 text-white flex items-center justify-center font-bold">&times;</button>
            </div>
            <div class="space-y-3">
                <input type="text" id="cfg-banco" placeholder="Banco" class="w-full bg-black/40 p-3 rounded-xl border border-gray-700 text-sm text-white focus:outline-none">
                <input type="text" id="cfg-rif" placeholder="RIF / Cédula" class="w-full bg-black/40 p-3 rounded-xl border border-gray-700 text-sm text-white focus:outline-none">
                <input type="text" id="cfg-tel" placeholder="Teléfono" class="w-full bg-black/40 p-3 rounded-xl border border-gray-700 text-sm text-white focus:outline-none">
                <button type="button" onclick="saveConfig()" class="w-full accent-gradient text-white font-bold py-3 rounded-xl uppercase text-xs tracking-wider transition-transform active:scale-95">Reescribir Datos</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- LOGIC SYSTEM CON INYECCIÓN SEGURA -->
    <script>
        const BACKUP_PRODUCTOS = [
            { id: 't1', name: 'Tequeños Tradicionales', price: 3.50, stock: 25, image: 'https://images.unsplash.com/photo-1541532713592-79a0317b6b77?w=400', category: 'tequeños', desc: 'Artesanales, full queso' },
            { id: 'c2', name: 'Chilenas Criollas', price: 2.00, stock: 30, image: 'https://images.unsplash.com/photo-1626132647523-66f5bf380027?w=400', category: 'empanadas', desc: 'Masa fina, horneadas perfectas' },
            { id: 'e3', name: 'Empanadas de Carne', price: 1.50, stock: 5, image: 'https://images.unsplash.com/photo-1628102479435-08e1327be885?w=400', category: 'empanadas', desc: 'Sabor tradicional criollo' },
            { id: 'b1', name: 'Jugo Natural Naranja', price: 1.25, stock: 40, image: 'https://images.unsplash.com/photo-1600271886742-f049cd1f3033?w=400', category: 'bebidas', desc: '100% fruta natural' }
        ];

        let currentSettings = JSON.parse(localStorage.getItem('4r_settings')) || { banco: 'Bancamiga (0172)', rif: 'V-23486156', tel: '0424571136' };
        let currentProducts = JSON.parse(localStorage.getItem('4r_products')) || BACKUP_PRODUCTOS;
        let currentCart = {};
        let currentFilter = 'todos';
        let isDarkMode = true;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-amber-600' };
            toast.className = `toast ${colors[type] || 'bg-neutral-700'} text-white px-5 py-3 rounded-xl text-sm font-bold flex items-center gap-3 shadow-xl`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text)
                .then(() => showToast(`✓ Copiado: ${text}`, 'success'))
                .catch(() => showToast('Error al copiar', 'error'));
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('theme-icon');
            if(icon) icon.className = isDarkMode ? 'ph ph-moon-stars text-lg' : 'ph ph-sun text-lg';
            localStorage.setItem('4r_theme', isDarkMode ? 'dark' : 'light');
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            const activePill = document.getElementById(`cat-${cat}`);
            if(activePill) activePill.classList.add('active');
            syncPlatform();
        }

        function updateVolume(productId, change) {
            if (currentCart[productId] === undefined) currentCart[productId] = 0;
            const product = currentProducts.find(p => p.id === productId);
            const newQty = currentCart[productId] + change;
            if (newQty >= 0 && newQty <= (product?.stock || 0)) {
                currentCart[productId] = newQty;
                syncPlatform();
            } else if (newQty > (product?.stock || 0)) {
                showToast(`Límite de stock alcanzado`, 'warning');
            }
        }

        function calcTotals() {
            let total = 0, items = 0;
            Object
