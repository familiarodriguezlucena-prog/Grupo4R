<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Gastronómico Cuatro R</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b111e; color: #f1f5f9; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(180deg, rgba(11,17,30,0.95) 0%, rgba(7,11,20,1) 100%); }
        .glass-card { background: rgba(22, 31, 49, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .accent-gradient { background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%); }
    </style>
</head>
<body class="pb-36 min-h-screen relative">
    <div class="bg-overlay"></div>

    <header class="pt-12 pb-6 text-center">
        <div class="inline-block bg-amber-500 text-black font-black text-xs px-3 py-1 rounded-full mb-2 tracking-widest uppercase">4R PREMIUM</div>
        <h1 class="text-2xl font-black uppercase text-white px-4">Grupo Gastronómico Cuatro R</h1>
        <p class="text-[10px] tracking-[0.2em] text-amber-500 uppercase font-bold mt-1">Plataforma de Pedidos Barquisimeto</p>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-6">
        <form id="orderForm" action="https://formspree.io/f/TU_ID_DE_FORMSPREE" method="POST" enctype="multipart/form-data">
            
            <!-- Menú -->
            <div class="space-y-3 mb-6">
                <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-bowl-food"></i> Menú Disponible</h2>
                <div id="products-container" class="space-y-3"></div>
            </div>

            <!-- Envío -->
            <div class="space-y-3 mb-6">
                <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-map-pin"></i> Datos de Envío</h2>
                <div class="glass-card rounded-2xl p-4 space-y-3">
                    <input type="text" name="Nombre" placeholder="¿Quién recibe?" required class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm text-white">
                    <input type="tel" name="Telefono" placeholder="Teléfono" required class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm text-white">
                    <textarea name="Direccion" placeholder="Dirección en Barquisimeto" required class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm text-white resize-none"></textarea>
                </div>
            </div>

            <!-- Pago Móvil (DATOS FIJOS PARA QUE NUNCA SALGAN VACÍOS) -->
            <div class="space-y-3 mb-6">
                <h2 class="text-xs font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-wallet"></i> Pago Móvil</h2>
                <div class="glass-card rounded-2xl p-4 border-l-4 border-amber-500">
                    <p class="text-sm text-gray-300">Banco: <span class="font-bold text-white">Bancamiga (0172)</span></p>
                    <p class="text-sm text-gray-300">RIF / CI: <span class="font-bold text-white">V-23486156</span></p>
                    <p class="text-sm text-gray-300">Teléfono: <span class="font-bold text-white">0424571136</span></p>
                </div>
                <div class="relative mt-3">
                    <input type="file" name="Comprobante" id="file-input" required class="hidden">
                    <label for="file-input" class="flex items-center justify-center gap-3 w-full border border-dashed border-gray-700 rounded-xl p-5 bg-white/5 cursor-pointer">
                        <i class="ph ph-cloud-arrow-up text-amber-500"></i>
                        <span id="file-name" class="text-xs text-gray-400">Adjuntar captura de pago</span>
                    </label>
                </div>
                <input type="text" name="Referencia" placeholder="Últimos 4 de referencia" maxlength="4" required class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 text-sm text-white mt-2">
            </div>

            <input type="hidden" name="Total" id="hidden-total">
            <input type="hidden" name="Detalle" id="hidden-summary">
        </form>
    </main>

    <!-- Barra de Pago -->
    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 p-4 bg-black/80 backdrop-blur-md border-t border-white/10 hidden">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold">Total</p>
                <p class="text-xl font-black text-emerald-400" id="total-display">$0.00</p>
            </div>
            <button type="button" onclick="document.getElementById('orderForm').submit()" class="accent-gradient px-6 py-3 rounded-xl text-white font-bold text-xs uppercase">Enviar Pedido</button>
        </div>
    </div>

    <!-- Visor de Imagen -->
    <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <img id="lightbox-img" src="" class="max-w-full max-h-[80vh] rounded-xl shadow-2xl">
    </div>

    <script>
        // DATOS MAESTROS - MODIFICA ESTO PARA CAMBIAR PRODUCTOS
        const PRODUCTS = [
            { id: 1, name: 'Tequeños Tradicionales', price: 3.50, img: 'https://images.unsplash.com/photo-1541532713592-79a0317b6b77?w=400' },
            { id: 2, name: 'Chilenas Artesanales', price: 2.00, img: 'https://images.unsplash.com/photo-1626132647523-66f5bf380027?w=400' },
            { id: 3, name: 'Empanadas Criollas', price: 1.50, img: 'https://images.unsplash.com/photo-1628102479435-08e1327be885?w=400' }
        ];

        let cart = {};

        function init() {
            const container = document.getElementById('products-container');
            container.innerHTML = PRODUCTS.map(p => `
                <div class="glass-card p-3 rounded-2xl flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <img src="${p.img}" onclick="event.stopPropagation(); openImg('${p.img}')" class="w-16 h-16 rounded-xl object-cover border border-gray-700 cursor-pointer">
                        <div>
                            <h3 class="font-bold text-white text-sm">${p.name}</h3>
                            <p class="text-emerald-400 font-bold text-sm">$${p.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 bg-black/40 p-1.5 rounded-xl border border-gray-700">
                        <button onclick="updateCart(${p.id}, -1)" class="w-8 h-8 text-gray-400">-</button>
                        <span class="text-white font-bold text-sm w-4 text-center">${cart[p.id] || 0}</span>
                        <button onclick="updateCart(${p.id}, 1)" class="w-8 h-8 text-rose-500 font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateCart(id, val) {
            cart[id] = Math.max(0, (cart[id] || 0) + val);
            let total = 0, items = [];
            PRODUCTS.forEach(p => {
                if(cart[p.id]) {
                    total += p.price * cart[p.id];
                    items.push(`${p.name} (x${cart[p.id]})`);
                }
            });
            document.getElementById('total-display').innerText = `$${total.toFixed(2)}`;
            document.getElementById('hidden-total').value = `$${total.toFixed(2)}`;
            document.getElementById('hidden-summary').value = items.join(', ');
            document.getElementById('checkout-bar').classList.toggle('hidden', total === 0);
            init();
        }

        function openImg(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        document.getElementById('file-input').onchange = e => {
            document.getElementById('file-name').innerText = e.target.files[0].name;
        };

        init();
    </script>
</body>
</html>
