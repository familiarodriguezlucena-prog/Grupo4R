<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4R Gastronómico - Orden Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap');
        * { transition: background-color 0.3s ease, color 0.3s ease; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b111e; 
            color: #f1f5f9;
        }
        body.light-mode {
            background-color: #fafafa;
            color: #1e293b;
        }
        .animated-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -2; 
            background: linear-gradient(135deg, #0b111e 0%, #1a2332 50%, #0f1624 100%);
        }
        body.light-mode .animated-bg {
            background: linear-gradient(135deg, #fff8f0 0%, #fef3e2 50%, #fafaf0 100%);
        }
        .glass-card { 
            background: rgba(22, 31, 49, 0.8); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(218, 165, 32, 0.15); 
        }
        body.light-mode .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(218, 165, 32, 0.2);
        }
        .accent-gradient { 
            background: linear-gradient(135deg, #d4801e 0%, #f4a225 100%); 
        }
        .product-card {
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(218, 165, 32, 0.5);
        }
        .product-image-wrapper img {
            transition: transform 0.2s ease;
        }
        .product-image-wrapper:hover img {
            transform: scale(1.08);
        }
        .toast {
            position: fixed;
            bottom: 110px;
            right: 20px;
            z-index: 100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .category-pill {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(218, 165, 32, 0.3);
            background: transparent;
            color: #f1f5f9;
        }
        body.light-mode .category-pill {
            color: #1e293b;
        }
        .category-pill.active {
            background: linear-gradient(135deg, #d4801e 0%, #f4a225 100%);
            border-color: #d4801e;
            color: #0b111e !important;
        }
        .stock-badge {
            position: absolute;
            bottom: 3px;
            right: 3px;
            z-index: 20;
        }
        .stock-badge span {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
        }
        .stock-in span { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
        .stock-low span { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        .stock-out span { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; }
        .qty-selector {
            background: rgba(22, 31, 49, 0.8);
            border: 2px solid rgba(218, 165, 32, 0.3);
            border-radius: 12px;
            padding: 6px 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        body.light-mode .qty-selector {
            background: rgba(255, 255, 255, 0.9);
        }
        .qty-selector button {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .theme-toggle { cursor: pointer; transition: transform 0.2s ease; }
        .theme-toggle:hover { transform: scale(1.1); }
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-blur: border(8px);
        }
        .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <button type="button" onclick="toggleTheme()" class="theme-toggle w-10 h-10 rounded-lg glass-card flex items-center justify-center text-amber-500">
                <i id="theme-icon" class="ph ph-moon-stars text-lg"></i>
            </button>
            
            <div class="flex items-center gap-2">

                <div class="text-center">
                    <p class="text-xs font-black text-amber-500">4R Gastronómico</p>
                    <p class="text-[9px] text-amber-600">Premium Food</p>
                </div>
            </div>
            
            <button type="button" onclick="openAdmin()" class="w-10 h-10 glass-card rounded-lg flex items-center justify-center text-amber-500">
                <i class="ph ph-gear-six text-lg"></i>
            </button>
        </div>
    </div>

    <header class="pt-24 pb-6 text-center relative z-10">

    </header>

        <div class="flex gap-2 overflow-x-auto pb-2">

            <button type="button" onclick="filterCategory('tequeños')" class="category-pill whitespace-nowrap" id="cat-tequeños">Tequeños</button>
            <button type="button" onclick="filterCategory('empanadas')" class="category-pill whitespace-nowrap" id="cat-empanadas">Empanadas</button>
            <button type="button" onclick="filterCategory('bebidas')" class="category-pill whitespace-nowrap" id="cat-bebidas">Bebidas</button>
            <button type="button" onclick="filterCategory('combos')" class="category-pill whitespace-nowrap" id="cat-combos">Combos</button>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4 space-y-6">
        <form id="orderForm" action="https://formspree.io/f/xyzqwvjk" method="POST" enctype="multipart/form-data" class="space-y-6">

                <div id="products-container" class="grid grid-cols-1 gap-3"></div>
                <div id="no-results" class="hidden text-center py-12 text-gray-400">
                    <p class="text-sm font-bold">No se encontraron productos</p>
                </div>
            </div>
