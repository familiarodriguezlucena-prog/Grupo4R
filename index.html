<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Gastronómico Cuatro R</title>
    <!-- Frameworks & Iconos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0b0f17; 
            color: #e6edf3; 
        }
        
        /* FONDO ANIMADO ULTRA-SUAVE */
        .bg-slideshow { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -2; 
            background-size: cover; 
            background-position: center; 
            transition: background-image 2s ease-in-out; 
        }
        
        .bg-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            background: linear-gradient(180deg, rgba(11,15,23,0.85) 0%, rgba(11,15,23,0.98) 100%); 
        }
        
        .glass-card { 
            background: rgba(22, 27, 34, 0.75); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06); 
        }

        /* DISEÑO DE LOGO POR TEXTO ESTILIZADO (Evita errores de carga) */
        .brand-logo {
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #ffffff 30%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="pb-32 min-h-screen relative">

    <!-- CONTENEDORES DE FONDO -->
    <div id="dynamic-bg" class="bg-slideshow"></div>
    <div class="bg-overlay"></div>

    <!-- BOTÓN DE ENGRANAJE PARA CONFIGURACIÓN -->
    <button type="button" onclick="openAdminPanel()" class="fixed top-4 right-4 z-40 w-11 h-11 glass-card rounded-xl flex items-center justify-center text-gray-400 hover:text-white active:scale-95 transition-all">
        <i class="ph ph-gear-six text-xl"></i>
    </button>

    <!-- VISTA CLIENTE (TIENDA) -->
    <div id="store-view" class="block">
        <header class="pt-12 pb-6 text-center">
            <!-- Emblema Tipográfico de Alta Gama -->
            <div class="inline-block bg-gradient-to-b from-red-500 to-red-700 text-white font-black text-xl px-4 py-2 rounded-2xl shadow-lg mb-2 tracking-tighter">
                4R
            </div>
            <h1 class="text-xl brand-logo uppercase tracking-tight">Grupo Gastronómico Cuatro R</h1>
            <p class="text-[9px] tracking-[0.25em] text-gray-400 uppercase font-bold mt-1">Plataforma de Pedidos</p>
        </header>

        <main class="max-w-md mx-auto px-4 space-y-6">
            <!-- Contenedor de Productos -->
            <div class="space-y-3">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="ph ph-hash text-red-500"></i> Menú Disponible
                </h2>
                <div id="products-container" class="space-y-3">
                    <!-- Inyección limpia mediante JS -->
                </div>
            </div>

            <!-- Datos de Facturación / Pago Móvil -->
            <div class="space-y-3">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="ph ph-credit-card text-red-500"></i> Pasarela de Pago Móvil
                </h2>
                <div class="glass-card rounded-2xl p-5 border-l-4 border-red-500 space-y-2">
                    <p class="text-xs text-gray-400">Banco: <span id="p-banco" class="font-bold text-white ml-1">Cargando...</span></p>
                    <p class="text-xs text-gray-400">RIF / CI: <span id="p-rif" class="font-bold text-white ml-1">Cargando...</span></p>
                    <p class="text-xs text-gray-400">Teléfono: <span id="p-tel" class="font-bold text-white ml-1">Cargando...</span></p>
                </div>
            </div>
        </main>
    </div>

    <!-- PANEL ADMINISTRATIVO INDEPENDIENTE -->
    <div id="admin-panel" class="hidden fixed inset-0 z-50 bg-[#0b0f17] overflow-y-auto p-4">
        <div class="max-w-md mx-auto space-y-6 pt-6">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="ph ph-sliders text-red-500"></i> Panel de Configuración
                </h2>
                <button type="button" onclick="closeAdminPanel()" class="w-8 h-8 rounded-lg bg-gray-800 text-gray-400 flex items-center justify-center text-xl">&times;</button>
            </div>

            <!-- Configuración Base de Pago Móvil -->
            <div class="glass-card p-4 rounded-2xl space-y-3">
                <p class="text-xs font-bold text-red-400 uppercase tracking-wider">1. Datos de Cuenta</p>
                <input type="text" id="in-banco" class="w-full bg-black/40 p-3 rounded-xl border border-gray-800 text-sm text-white focus:border-red-500 focus:outline-none">
                <input type="text" id="in-rif" class="w-full bg-black/40 p-3 rounded-xl border border-gray-800 text-sm text-white focus:border-red-500 focus:outline-none">
                <input type="text" id="in-tel" class="w-full bg-black/40 p-3 rounded-xl border border-gray-800 text-sm text-white focus:border-red-500 focus:outline-none">
                <button type="button" onclick="saveSettings()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl uppercase text-xs tracking-wider transition-all">
                    Guardar y Aplicar Cambios
                </button>
            </div>

            <!-- Agregar Producto Manual -->
            <div class="glass-card p-4 rounded-2xl space-y-3">
                <p class="text-xs font-bold text-green-400 uppercase tracking-wider">2. Añadir Producto Al Menú</p>
                <input type="text" id="in-p-name" placeholder="Nombre (Ej: Tequeños Full Relleno)" class="w-full bg-black/40 p-3 rounded-xl border border-gray-800 text-sm text-white focus:border-green-500 focus:outline-none">
                <input type="number" step="0.01" id="in-p-price" placeholder="Precio en USD (Ej: 3.50)" class="w-full bg-black/40 p-3 rounded-xl border border-gray-800 text-sm text-white focus:border-green-500 focus:outline-none">
                <button type="button" onclick="addProduct()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl uppercase text-xs tracking-wider transition-all">
                    Insertar Producto
                </button>
            </div>

            <!-- Inventario -->
            <div class="space-y-2">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">3. Productos Registrados</p>
                <div id="admin-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- CONTROLADORES JAVASCRIPT SIN COMPONENTES EXTERNOS BLOCANTES -->
    <script>
        // Imágenes Gastronómicas Reales para el Fondo Dinámico
        const backgroundImages = [
            "https://images.unsplash.com/photo-1541532713592-79a0317b6b77?auto=format&fit=crop&q=80&w=1000", 
            "https://images.unsplash.com/photo-1626132647523-66f5bf380027?auto=format&fit=crop&q=80&w=1000", 
            "https://images.unsplash.com/photo-1628102479435-08e1327be885?auto=format&fit=crop&q=80&w=1000"
        ];
        
        let bgIndex = 0;
        function changeBackground() {
            const bgContainer = document.getElementById('dynamic-bg');
            if(bgContainer) {
                bgContainer.style.backgroundImage = `url('${backgroundImages[bgIndex]}')`;
                bgIndex = (bgIndex + 1) % backgroundImages.length;
            }
        }
        // Iniciar rotación cada 6 segundos
        changeBackground();
        setInterval(changeBackground, 6000);

        // Clave del panel
        const SECRET_KEY = "4r123";

        // Inicialización de persistencia local robusta
        let settings = JSON.parse(localStorage.getItem('4r_settings')) || { banco: 'Bancamiga (0172)', rif: 'J-504728910', tel: '0412-3856184' };
        let products = JSON.parse(localStorage.getItem('4r_products')) || [
            { id: 1, name: 'Tequeños Tradicionales', price: 3.50 },
            { id: 2, name: 'Chilenas Artesanales', price: 2.00 },
            { id: 3, name: 'Empanadas Criollas', price: 1.50 }
        ];

        function renderApp() {
            // Inyectar datos en la tienda de clientes
            document.getElementById('p-banco').innerText = settings.banco;
            document.getElementById('p-rif').innerText = settings.rif;
            document.getElementById('p-tel').innerText = settings.tel;

            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            products.forEach(p => {
                container.innerHTML += `
                    <div class="glass-card p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-white text-sm tracking-tight">${p.name}</h3>
                            <p class="text-green-400 font-bold text-sm mt-0.5">$${parseFloat(p.price).toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-3 bg-black/40 p-1 rounded-xl border border-gray-800">
                            <button type="button" class="w-8 h-8 text-gray-400 font-bold hover:text-white">-</button>
                            <span class="text-white font-bold text-xs">0</span>
                            <button type="button" class="w-8 h-8 text-red-500 font-bold hover:text-red-400">+</button>
                        </div>
                    </div>
                `;
            });

            // Preparar campos del panel de administración
            document.getElementById('in-banco').value = settings.banco;
            document.getElementById('in-rif').value = settings.rif;
            document.getElementById('in-tel').value = settings.tel;

            const adminList = document.getElementById('admin-list');
            adminList.innerHTML = '';
            products.forEach((p, index) => {
                adminList.innerHTML += `
                    <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                        <span class="text-xs text-white font-medium">${p.name} ($${parseFloat(p.price).toFixed(2)})</span>
                        <button type="button" onclick="deleteProduct(${index})" class="text-red-400 hover:text-red-500 p-1">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                `;
            });
        }

        // Acciones del Panel Administrativo
        function openAdminPanel() {
            const access = prompt("Por favor ingrese la contraseña de acceso:");
            if (access === SECRET_KEY) {
                document.getElementById('admin-panel').classList.remove('hidden');
            } else if (access !== null) {
                alert("Contraseña inválida.");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function saveSettings() {
            settings = {
                banco: document.getElementById('in-banco').value.trim(),
                rif: document.getElementById('in-rif').value.trim(),
                tel: document.getElementById('in-tel').value.trim()
            };
            localStorage.setItem('4r_settings', JSON.stringify(settings));
            alert("¡Estructura de pago actualizada correctamente!");
            renderApp();
            closeAdminPanel();
        }

        function addProduct() {
            const nameInput = document.getElementById('in-p-name');
            const priceInput = document.getElementById('in-p-price');
            
            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);

            if (name && !isNaN(price)) {
                products.push({ id: Date.now(), name: name, price: price });
                localStorage.setItem('4r_products', JSON.stringify(products));
                
                nameInput.value = '';
                priceInput.value = '';
                
                renderApp();
            } else {
                alert("Por favor introduce datos válidos.");
            }
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            localStorage.setItem('4r_products', JSON.stringify(products));
            renderApp();
        }

        // Arrancar la aplicación de inmediato
        renderApp();
    </script>
</body>
</html>
