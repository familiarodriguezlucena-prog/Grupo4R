<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4R Gastronómico | Orden Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0A0A0A; color: #F8FAFC; transition: background 0.3s; }
        
        .glass-card { 
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .product-card { transition: all 0.3s ease; border: 2px solid transparent; }
        .product-card:hover { border-color: rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body class="pb-32">

    <header class="fixed top-0 w-full z-40 bg-black/60 backdrop-blur-md border-b border-white/5">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center font-black text-white">4R</div>
                <div>
                    <h1 class="text-sm font-black uppercase">Gastronómico</h1>
                    <p class="text-[9px] text-yellow-600 uppercase tracking-widest">Premium Food</p>
                </div>
            </div>
            <button onclick="toggleAdmin()" class="text-slate-400 hover:text-white"><i class="ph ph-gear-six text-xl"></i></button>
        </div>
    </header>

    <main class="pt-24 max-w-md mx-auto px-4 space-y-6">
        <form id="orderForm" action="https://formspree.io/f/xyzqwvjk" method="POST" class="space-y-6">
            <div id="products-container" class="space-y-4"></div>
            
            <div class="glass-card rounded-2xl p-4 space-y-4">
                <h2 class="text-xs font-black text-yellow-600 uppercase">Datos de Envío</h2>
                <input type="text" name="Nombre" placeholder="Tu nombre" required class="w-full bg-black/40 border border-slate-700 rounded-xl p-3 text-sm outline-none">
                <textarea name="Direccion" placeholder="Dirección exacta" required class="w-full bg-black/40 border border-slate-700 rounded-xl p-3 text-sm outline-none"></textarea>
            </div>
            
            <input type="hidden" name="Detalle_Pedido" id="hidden-summary">
            <input type="hidden" name="Total" id="hidden-total">
        </form>
    </main>

    <div class="fixed bottom-0 w-full p-4 bg-gradient-to-t from-black via-black to-transparent z-50">
        <div class="max-w-md mx-auto glass-card rounded-2xl p-4 flex items-center justify-between border-yellow-600/30">
            <div>
                <p class="text-[10px] text-slate-400 uppercase">Total Pedido</p>
                <p id="total-display" class="text-xl font-black text-white">$0.00</p>
            </div>
            <button onclick="document.getElementById('orderForm').submit()" class="gold-gradient px-6 py-3 rounded-xl font-black text-xs uppercase shadow-lg text-black">
                Confirmar
            </button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Tequeños Tradicionales', price: 3.50, img: 'https://images.unsplash.com/photo-1541532713592-79a0317b6b77?w=200' },
            { id: 2, name: 'Empanadas de Carne', price: 1.50, img: 'https://images.unsplash.com/photo-1628102479435-08e1327be885?w=200' }
        ];

        let cart = JSON.parse(localStorage.getItem('4r_cart')) || {};

        function render() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map(p => `
                <div class="product-card glass-card p-4 rounded-2xl flex items-center gap-4">
                    <img src="${p.img}" class="w-16 h-16 rounded-lg object-cover">
                    <div class="flex-1">
                        <h3 class="text-sm font-bold">${p.name}</h3>
                        <p class="text-emerald-400 font-bold text-sm">$${p.price.toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateCart(${p.id}, -1)" class="w-8 h-8 rounded-lg bg-black text-red-400">-</button>
                        <span class="font-bold w-4 text-center">${cart[p.id] || 0}</span>
                        <button onclick="updateCart(${p.id}, 1)" class="w-8 h-8 rounded-lg bg-yellow-600 text-black">+</button>
                    </div>
                </div>
            `).join('');
            updateTotals();
        }

        function updateCart(id, change) {
            cart[id] = Math.max(0, (cart[id] || 0) + change);
            localStorage.setItem('4r_cart', JSON.stringify(cart));
            render();
        }

        function updateTotals() {
            let total = 0, summary = [];
            products.forEach(p => {
                if (cart[p.id] > 0) {
                    total += p.price * cart[p.id];
                    summary.push(`${p.name} x${cart[p.id]}`);
                }
            });
            document.getElementById('total-display').textContent = `$${total.toFixed(2)}`;
            document.getElementById('hidden-total').value = total.toFixed(2);
            document.getElementById('hidden-summary').value = summary.join(', ');
        }

        function toggleAdmin() { alert("Sistema de control 4R - Acceso restringido"); }

        render();
    </script>
</body>
</html>
